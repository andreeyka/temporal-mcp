services:
  temporal-mcp:
    image: ${DOCKER_IMAGE:-temporal-mcp}:${DOCKER_TAG:-latest}
    build:
      context: .
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim-trixie}
        UV_IMAGE: ${UV_IMAGE:-ghcr.io/astral-sh/uv:0.11.26}
    env_file:
      - .env
    environment:
      MCP_PORT: ${MCP_PORT:-8000}
    ports:
      - "127.0.0.1:${MCP_PUBLISHED_PORT:-8000}:${MCP_PORT:-8000}"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    restart: unless-stopped
